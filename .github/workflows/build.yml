name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily

jobs:
  build:
    name: Build py${{ matrix.python-version }} @ ${{ matrix.os }} 🐍
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.12']
        os: ['ubuntu-latest']
        ymlfile: ['environment.yml']
        include:
          - os: 'windows-latest'
            python-version: '3.12'
            ymlfile: 'environment.yml'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}

      - name: Update Conda and Verify Channels
        shell: bash -l {0}
        run: |
          conda install -y -n base -c conda-forge conda
          conda config --add channels conda-forge
          conda config --set channel_priority strict

      - name: Create or Update Environment
        shell: bash -l {0}
        run: |
          conda env create -f ${{ matrix.ymlfile }} || conda env update -f ${{ matrix.ymlfile }}
          conda activate qa4sm_reader

      - name: Print Environment Information
        shell: bash -l {0}
        run: |
          conda info -a
          conda list
          pip list
          which pip
          which python

      - name: Export Environment
        shell: bash -l {0}
        run: |
          mkdir -p artifacts
          filename=env_py${{ matrix.python-version }}_${{ matrix.os }}.yml
          conda env export --no-builds | grep -v "prefix" > artifacts/$filename

      - name: Install Package and Run Tests
        shell: bash -l {0}
        run: |
          pip install -e .
          pytest

      - name: Create Wheel and Distribution Package
        shell: bash -l {0}
        run: |
          pip install -U setuptools
          pip install setuptools_scm twine wheel
          python setup.py --version
          python setup.py sdist --dist-dir artifacts/dist
          python setup.py bdist_wheel --dist-dir artifacts/dist
          ls artifacts/dist
          twine check artifacts/dist/*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-py${{ matrix.python-version }}-${{ matrix.os }}
          path: artifacts/*

      - name: Upload Coverage
        shell: bash -l {0}
        run: |
          pip install coveralls && coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true

  coveralls:
    name: Submit Coveralls 👚
    needs: build
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls && coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi-package:
    name: Publish PyPI 🚀
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      startsWith(github.repository, 'awst-austria')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print Environment Variables
        run: |
          echo "GITHUB_REF = $GITHUB_REF"
          echo "GITHUB_REPOSITORY = $GITHUB_REPOSITORY"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: Artifacts
          pattern: Artifacts-*
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -aR

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.4.1
        with:
          skip_existing: true
          verbose: true
          verify_metadata: true
          packages_dir: Artifacts/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
